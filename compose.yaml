x-runtime: &runtime
  build: .
  image: leadminer-core:local
  environment:
    DATABASE_URL_FILE: /run/secrets/db_url
  secrets:
    - db_url
  depends_on:
    migrate:
      condition: service_completed_successfully
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadminer
      POSTGRES_USER: leadminer
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U leadminer -d leadminer"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres:/var/lib/postgresql/data
    logging: *logging
  migrate:
    <<: *runtime
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  cli:
    <<: *runtime
    profiles: ["cli"]
    init: true
    volumes:
      - results:/data/results
  api:
    <<: *runtime
    profiles: ["api"]
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:${LEADMINER_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 4
  worker:
    <<: *runtime
    profiles: ["api"]
    init: true
    command: ["python", "-m", "api.worker"]
    stop_grace_period: 25s

secrets:
  db_url:
    file: ${LEADMINER_DB_URL_FILE:-./.secrets/db-url}
  db_password:
    file: ${LEADMINER_DB_PASSWORD_FILE:-./.secrets/db-password}
volumes:
  postgres:
  results:
